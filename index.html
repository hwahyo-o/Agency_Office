<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 팀 오피스</title><style>body{margin:0;background:#f7f8fa;color:#202936;font:16px/1.6 system-ui,sans-serif}.wrap{max-width:760px;margin:8vh auto;padding:28px}.box{background:white;border:1px solid #e8edf1;border-radius:16px;padding:30px}.tag{color:#6380ed;font-size:12px;font-weight:700;letter-spacing:1px}h1{font-size:30px;margin:8px 0}p{color:#77818e}.btn{display:inline-block;margin-top:10px;background:#5579ed;color:#fff;padding:11px 16px;border-radius:9px;text-decoration:none;font-weight:650}.note{font-size:12px;color:#929ba6}</style><div class="wrap"><div class="box"><div class="tag">OPEN SOURCE · LOCAL FIRST</div><h1>AI 팀 오피스</h1><p>ChatGPT 계정으로 로그인하고 사용 동의를 마치면, Agency Agents 전문가 팀이 작업을 나누어 수행합니다.</p><p>보안상 앱과 OAuth 콜백은 사용자의 컴퓨터에서 실행됩니다. 이 저장소를 내려받아 <b>START-OFFICE.cmd</b>를 실행하세요. API 키는 필요하지 않으며, 요청은 ChatGPT 플랜의 사용량 한도에 따릅니다.</p><a class="btn" href="https://github.com/hwahyo-o/Agency_Office">공개 소스와 실행 안내 보기</a><p class="note">ChatGPT 대화 내역은 연결되지 않습니다. 동의 화면에서 요청 권한을 검토한 뒤 승인하세요.</p></div></div></html>
