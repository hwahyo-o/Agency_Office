  <style>
    :root{--ink:#202735;--muted:#7c8798;--line:#e7eaf0;--paper:#fff;--canvas:#f6f7fb;--blue:#5978ef;--pale:#edf1ff;--green:#278b70;--sidebar:246px}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:16px;padding:0 10px 22px}.brand-mark{width:32px;height:32px;border-radius:11px;background:var(--pale);display:grid;place-items:center;color:var(--blue);font-size:18px}.nav-group{margin:13px 10px 7px;color:#a0a8b4;font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.nav-link{border:0;background:transparent;width:100%;display:flex;gap:11px;align-items:center;text-align:left;padding:9px 11px;border-radius:9px;color:#667183;font-size:12px;font-weight:550;margin:1px 0}.nav-link:hover{background:#f7f8fc;color:var(--ink)}.nav-link.active{background:var(--pale);color:#3d5fdd;font-weight:700}.nav-icon{width:18px;text-align:center;font-size:14px;color:#8390a2}.nav-link.active .nav-icon{color:var(--blue)}.sidebar-foot{margin-top:auto;padding-top:15px;border-top:1px solid var(--line)}.main{margin-left:var(--sidebar);min-height:100vh}.topbar{height:64px;background:rgba(255,255,255,.86);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4;backdrop-filter:blur(10px)}.crumb{color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:10px}.search{height:34px;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:#fff;font-size:11px}.avatar{width:31px;height:31px;border-radius:50%;background:#ecf0f6;color:#5f6b7d;display:grid;place-items:center;font-weight:700;font-size:11px}.content{max-width:1240px;padding:31px 34px 60px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:15px}.page-head h1{font-size:22px;font-weight:730;letter-spacing:-.035em;margin:0 0 5px}.page-head p{font-size:12px;color:var(--muted);margin:0}.eyebrow{font-size:10px;font-weight:700;color:#8190a5;letter-spacing:.09em;text-transform:uppercase}.card-soft{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px}.hero{padding:26px 28px;border-radius:16px;background:linear-gradient(115deg,#fff 15%,#f5f7ff 100%);border:1px solid var(--line);margin-bottom:18px}.hero h2{font-size:23px;font-weight:730;letter-spacing:-.04em;margin:7px 0}.hero p{font-size:12px;color:var(--muted);margin:0}.btn-primary{--bs-btn-bg:var(--blue);--bs-btn-border-color:var(--blue);--bs-btn-hover-bg:#4868df;--bs-btn-hover-border-color:#4868df}.btn{font-size:11px;font-weight:650;border-radius:8px;padding:8px 12px}.btn-light{border:1px solid var(--line);background:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{padding:16px 17px}.stat span{font-size:11px;color:var(--muted)}.stat b{display:block;font-size:22px;margin-top:5px;font-weight:720}.section-title{font-size:13px;font-weight:700;margin:0}.section-sub{color:var(--muted);font-size:11px;margin:3px 0 0}.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}.task-form textarea{min-height:170px;resize:vertical;border-color:var(--line);font-size:13px;line-height:1.65;padding:13px}.task-form select,.form-select,.form-control{font-size:12px;border-color:var(--line);border-radius:8px}.task-form .form-label,.form-label{font-size:11px;font-weight:650;color:#657184}.status-pill{border-radius:99px;padding:5px 9px;background:#f0f2f5;color:#778395;font-size:10px}.status-pill.on{color:var(--green);background:#eaf7f3}.empty{padding:34px 15px;text-align:center;color:#8a94a3}.empty b{display:block;color:#4d596a;font-size:12px;margin-bottom:5px}.empty span{font-size:11px}.empty-icon{height:39px;width:39px;border-radius:13px;background:#f3f5f9;color:#7f8ca1;display:grid;place-items:center;margin:0 auto 11px;font-size:17px}.agent-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.agent-card{padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:62px}.agent-card b{display:block;font-size:11px;font-weight:670;text-transform:capitalize}.agent-card small{color:var(--muted);font-size:10px}.agent-meta{font-size:10px;color:var(--muted)}.result-card{border-color:#dce4ff;background:#fff}.result-card .result-text{font-size:12px;line-height:1.7;white-space:pre-wrap}.file-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}.file-name{font-size:11px;font-weight:680}.file-type{font-size:10px;color:var(--muted)}.preview-frame{width:100%;height:390px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:12px}.preview-text{white-space:pre-wrap;overflow:auto;max-height:390px;background:#f8f9fb;padding:13px;border-radius:9px;font-size:11px}.table-preview{overflow:auto;max-height:390px}.table-preview td,.table-preview th{font-size:10px}.filter-row{display:flex;gap:9px;align-items:center}.table-clean{font-size:11px}.table-clean th{color:#7f8b9b;font-weight:650;border-bottom-color:var(--line)}.table-clean td{vertical-align:middle}.check{accent-color:var(--blue)}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.workspace-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.workspace-card{color:inherit;text-decoration:none;cursor:pointer;transition:transform .12s,border-color .12s}.workspace-card:hover{transform:translateY(-2px);border-color:#cbd5ff}.workspace-card strong{display:block;font-size:12px;margin:10px 0 3px}.workspace-card span{font-size:10px;color:var(--muted)}.workspace-icon{height:34px;width:34px;border-radius:11px;background:#f2f4f8;color:#61728d;display:grid;place-items:center}.divider{height:1px;background:var(--line);margin:17px 0}.mobile-menu{display:none}.muted{color:var(--muted)}.small-label{font-size:10px;color:var(--muted)}.alert-soft{background:#f6f8ff;border:1px solid #e3e9ff;color:#5c6a87;font-size:11px;padding:12px;border-radius:9px}.download-card{border:1px solid var(--line);border-radius:10px;padding:13px;background:white}.download-card:hover{border-color:#cbd5ff}@media(max-width:900px){:root{--sidebar:205px}.content{padding:24px 20px 50px}.topbar{padding:0 20px}.agent-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.workspace-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.sidebar{display:none}.main{margin-left:0}.mobile-menu{display:inline-flex}.topbar{height:57px;padding:0 13px}.content{padding:20px 13px 38px}.search{display:none}.page-head h1{font-size:19px}.page-head{align-items:center}.two-col{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.agent-grid,.workspace-grid,.settings-grid{grid-template-columns:1fr}.hero{padding:22px}.hero h2{font-size:20px}.page-head .btn{white-space:nowrap}}
    :root{--blue:#356cf6;--pale:#edf3ff;--canvas:#f5f7f9;--line:#e9edf2;--ink:#172231;--muted:#778394;--green:#148766}.card-soft,.hero{border-radius:17px;box-shadow:0 2px 8px rgba(30,46,72,.018)}.hero{background:linear-gradient(120deg,#fff 10%,#f4f7ff 100%);border-radius:20px}.btn{border-radius:10px}.btn-primary{--bs-btn-bg:#356cf6;--bs-btn-border-color:#356cf6;--bs-btn-hover-bg:#245de8;--bs-btn-hover-border-color:#245de8;box-shadow:0 3px 8px rgba(53,108,246,.16)}.connector-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.connector-card{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff;transition:.15s;min-height:148px}.connector-card:hover{border-color:#cbd8f4;transform:translateY(-2px);box-shadow:0 8px 20px rgba(35,68,126,.06)}.connector-mark{width:38px;height:38px;border-radius:12px;background:#f3f6fb;color:#334663;display:grid;place-items:center;font-size:18px}.connector-card h3{font-size:12px;font-weight:720;margin:13px 0 2px}.connector-card p{font-size:10px;color:var(--muted);margin:0 0 12px;min-height:30px}.connector-state{font-size:10px;color:#768397}.connector-card .btn{padding:7px 10px}.mobile-bottom{display:none}.mobile-shade{display:none}.nav-icon{display:inline-flex;justify-content:center}.nav-link.active{color:#245de8}#sideNav{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#d7deea transparent}#sideNav::-webkit-scrollbar{width:5px}#sideNav::-webkit-scrollbar-thumb{background:#d7deea;border-radius:9px}.sidebar-foot{flex-shrink:0}@media(max-width:900px){.connector-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.sidebar{display:flex;transform:translateX(-105%);transition:transform .2s ease;box-shadow:12px 0 30px rgba(20,30,50,.08)}.sidebar.mobile-open{transform:translateX(0)}.mobile-shade.show{display:block;position:fixed;inset:0;background:rgba(17,27,43,.22);z-index:4}.content{padding-bottom:98px}.mobile-bottom{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);inset:auto 0 0;z-index:4;padding:7px 5px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line);backdrop-filter:blur(12px)}.mobile-bottom button{border:0;background:none;color:#788597;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0}.mobile-bottom button i{font-size:18px;line-height:1}.mobile-bottom button.active{color:#356cf6;font-weight:700}.connector-grid{grid-template-columns:1fr}.connector-card{min-height:130px}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">✳</span><span>AI 팀 오피스</span></div>
    <nav id="sideNav" aria-label="주 메뉴"></nav>
    <div class="sidebar-foot"><button class="nav-link" data-page="settings"><span class="nav-icon"><i class="bi bi-gear"></i></span>설정</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="d-flex align-items-center gap-2"><button class="btn btn-light mobile-menu" id="menuButton" aria-label="메뉴 열기"><i class="bi bi-list"></i></button><span class="crumb" id="breadcrumb">전체 대시보드</span></div><div class="top-actions"><input class="search" id="globalSearch" placeholder="팀원, 업무, 프로젝트 검색"><span class="status-pill" id="topStatus">연결 확인 중</span><span class="avatar">AI</span></div></header>
    <div class="content" id="view"></div>
  </main>
</div>
<div class="mobile-shade" id="mobileShade"></div>
<nav class="mobile-bottom" aria-label="빠른 메뉴"><button data-page="dashboard"><i class="bi bi-grid-1x2"></i><span>홈</span></button><button data-page="request"><i class="bi bi-plus-circle"></i><span>새 작업</span></button><button data-page="tasks"><i class="bi bi-check2-square"></i><span>할 일</span></button><button data-page="connectors"><i class="bi bi-plug"></i><span>연결</span></button><button id="mobileMore"><i class="bi bi-three-dots"></i><span>더 보기</span></button></nav>
<div class="modal fade" id="connectorModal" tabindex="-1" aria-labelledby="connectorModalTitle" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 rounded-4 shadow"><div class="modal-header border-0 pb-0"><div><span class="eyebrow">SECURE CONNECTION</span><h2 class="modal-title fs-5 fw-bold mt-1" id="connectorModalTitle">커넥터 연결</h2></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button></div><div class="modal-body pt-3"><p id="connectorModalBody" class="small text-secondary mb-3"></p><div class="alert-soft"><i class="bi bi-shield-check me-1"></i>연결 설정이 완료되면 공식 로그인·동의 화면을 새 탭(안드로이드에서는 시스템 인증 탭)으로 열고, 승낙 뒤 앱으로 돌아오는 흐름을 사용합니다. 앱에서 비밀번호를 입력하거나 보관하지 않습니다.</div><a id="connectorDocs" class="btn btn-primary mt-3" target="_blank" rel="noopener">공식 설정 안내 열기 <i class="bi bi-box-arrow-up-right ms-1"></i></a></div><div class="modal-footer border-0 pt-0"><button class="btn btn-light" data-bs-dismiss="modal">닫기</button></div></div></div></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(() => {
  const nav = [
    {group:'WORKSPACE',items:[['dashboard','bi-grid-1x2','전체 대시보드'],['request','bi-plus-circle','새 작업 요청'],['tasks','bi-check2-square','할 일'],['spaces','bi-layers','업무 공간'],['automations','bi-arrow-repeat','자동 업무']]},
    {group:'RESOURCES',items:[['teams','bi-people','AI 팀'],['skills','bi-stars','스킬'],['connectors','bi-plug','커넥터'],['library','bi-collection','라이브러리'],['apps','bi-grid','앱'],['projects','bi-kanban','프로젝트']]},
    {group:'HISTORY',items:[['activity','bi-clock-history','전체 작업 내역']]}
  ];
  const titles={dashboard:'전체 대시보드',request:'새 작업 요청',tasks:'할 일',spaces:'업무 공간',automations:'자동 업무',teams:'AI 팀',skills:'스킬',connectors:'커넥터',library:'라이브러리',apps:'앱',projects:'프로젝트',activity:'전체 작업 내역',settings:'설정'};
  const $view=$('#view');let state={agents:[],models:[],files:[],connected:false,email:'',page:'dashboard',loading:false,previewMode:false};let pendingFiles=[];
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const read=(key,fallback=[])=>{try{return JSON.parse(localStorage.getItem('office:'+key))??fallback}catch{return fallback}};
  const write=(key,value)=>localStorage.setItem('office:'+key,JSON.stringify(value));
  const api=async(path,data)=>{const response=await fetch(path,{method:data?'POST':'GET',headers:data?{'content-type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const result=await response.json();if(!response.ok)throw Error(result.error||'요청을 처리하지 못했습니다.');return result};
  function drawNav(){const html=nav.map(group=>`<div class="nav-group">${group.group}</div>${group.items.map(([id,icon,label])=>`<button class="nav-link ${state.page===id?'active':''}" data-page="${id}"><span class="nav-icon"><i class="bi ${icon}"></i></span>${label}</button>`).join('')}`).join('');$('#sideNav').html(html);$('[data-page="settings"]').toggleClass('active',state.page==='settings');$('#breadcrumb').text(titles[state.page]||'AI 팀 오피스');$('.mobile-bottom [data-page]').removeClass('active').filter(`[data-page="${state.page}"]`).addClass('active')}
  function pageHead(title,sub,button=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
  function empty(icon,title,sub){return `<div class="empty"><div class="empty-icon">${icon}</div><b>${title}</b><span>${sub}</span></div>`}
  function fileCards(items){return items.map(file=>`<div class="file-row"><div><div class="file-name">${esc(file.filename)}</div><div class="file-type">${esc(file.createdAt||'파일 결과')} · ${esc(file.format||'파일')}</div></div><div class="d-flex gap-2"><a class="btn btn-light" href="${esc(file.url)}" download>다운로드</a>${file.previewUrl?`<a class="btn btn-light" target="_blank" rel="noopener" href="${esc(file.previewUrl)}">미리보기</a>`:''}</div></div>`).join('')}
  function agentsView(search=''){const list=state.agents.filter(a=>(a.name+' '+a.division).toLowerCase().includes(search.toLowerCase()));return `<div class="agent-grid">${list.map(a=>`<article class="agent-card"><b>${esc(a.name)}</b><small>${esc(a.division)}</small></article>`).join('')}</div>`}
  function dashboard(){const tasks=read('tasks'),files=state.files.length?state.files:read('files'),projects=read('projects'),auto=read('automations');return `${pageHead('전체 대시보드','업무와 결과물을 한곳에서 확인하세요.',`<button class="btn btn-primary" data-page="request">새 작업 요청 <span class="ms-1">→</span></button>`)}${state.previewMode?'<div class="alert-soft mb-3">사이트 미리보기에서는 화면 탐색만 가능합니다. 실제 AI 작업과 파일 생성은 Windows 앱에서 사용하세요.</div>':''}<section class="hero"><div class="eyebrow">AI TEAM WORKSPACE</div><h2>오늘 할 일을 팀에 맡겨보세요.</h2><p>요청을 실행하고, 완성된 결과 파일을 내려받아 이어서 사용할 수 있습니다.</p></section><div class="stats"><div class="card-soft stat"><span>진행 중인 할 일</span><b>${tasks.filter(x=>!x.done).length}</b></div><div class="card-soft stat"><span>완성 결과 파일</span><b>${files.length}</b></div><div class="card-soft stat"><span>프로젝트</span><b>${projects.length}</b></div><div class="card-soft stat"><span>자동 업무</span><b>${auto.length}</b></div></div><div class="two-col"><section class="card-soft"><div class="d-flex justify-content-between align-items-center"><div><h2 class="section-title">최근 작업</h2><p class="section-sub">직접 요청한 작업과 생성 결과</p></div><button class="btn btn-light" data-page="activity">전체 내역</button></div><div class="divider"></div>${tasks.length?tasks.slice(-5).reverse().map(t=>`<div class="file-row"><div><div class="file-name">${esc(t.title)}</div><div class="file-type">${esc(t.date)} · ${t.done?'완료':'진행 중'}</div></div><span class="status-pill ${t.done?'on':''}">${t.done?'완료':'진행 중'}</span></div>`).join(''):empty('↻','아직 작업 내역이 없습니다','새 요청을 실행하면 완료 내역과 파일이 여기에 모입니다.')}</section><section class="card-soft"><div><h2 class="section-title">ChatGPT 연결</h2><p class="section-sub">계정 로그인으로 사용할 모델을 연결합니다.</p></div><div class="divider"></div><div class="d-flex justify-content-between align-items-center"><span class="small-label">${state.connected?esc(state.email||'연결됨'):'연결된 계정 없음'}</span><span class="status-pill ${state.connected?'on':''}">${state.connected?'연결됨':'미연결'}</span></div><button class="btn btn-light mt-3" data-page="settings">연결 설정 보기</button></section></div>`}
  function requestPage(){return `${pageHead('새 작업 요청','문장, 이미지, 문서, 링크를 함께 보내면 팀이 결과 파일로 만듭니다.')}<section class="card-soft task-form"><div class="row g-3"><div class="col-12"><label class="form-label" for="taskInput">요청 내용</label><textarea id="taskInput" class="form-control" placeholder="예: 첨부한 캡처 화면을 참고해 11월 달력을 만들어줘."></textarea></div><div class="col-12"><div class="d-flex flex-wrap gap-2"><button type="button" class="btn btn-light" id="pickFiles"><i class="bi bi-paperclip me-1"></i>파일·이미지·동영상</button><button type="button" class="btn btn-light" id="pickFolder"><i class="bi bi-folder2-open me-1"></i>폴더</button><input id="attachmentInput" type="file" hidden multiple accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.odt,.rtf,.ppt,.pptx,.odp,.xls,.xlsx,.ods,.csv,.tsv,.txt,.md,.html,.json,.xml,.yaml,.yml,.js,.ts,.py,.css,.sql,.zip"><input id="folderInput" type="file" hidden multiple webkitdirectory directory><label class="small-label align-self-center mb-0">파일을 붙여넣거나 드래그해도 됩니다 · 요청당 총 50MB까지</label></div><div id="attachmentList" class="d-flex flex-wrap gap-2 mt-2"></div><div class="input-group mt-2"><span class="input-group-text bg-white"><i class="bi bi-link-45deg"></i></span><input id="linkInput" class="form-control" placeholder="참고 링크 붙여넣기 (여러 개는 줄바꿈)"></div></div><div class="col-md-4"><label class="form-label" for="modelSelect">사용 모델</label><select id="modelSelect" class="form-select"><option value="">${state.models.length?'모델을 선택하세요':'ChatGPT 연결 후 모델 표시'}</option>${state.models.map(m=>`<option value="${esc(m.slug)}">${esc(m.name)}</option>`).join('')}</select></div><div class="col-md-5"><label class="form-label" for="formatSelect">결과 파일 형식</label><select id="formatSelect" class="form-select"><option value="auto">자동 선택</option><option value="csv">CSV · 스프레드시트</option><option value="html">HTML · 인터랙티브 웹</option><option value="json">JSON · 데이터</option><option value="md">Markdown · 문서</option><option value="txt">TXT · 텍스트</option><option value="svg">SVG · 벡터 이미지</option><option value="ics">ICS · 캘린더</option><option value="xml">XML</option><option value="yaml">YAML</option><option value="sql">SQL</option><option value="js">JavaScript</option><option value="ts">TypeScript</option><option value="py">Python</option><option value="css">CSS</option></select></div><div class="col-md-3 d-flex align-items-end"><button id="runTask" class="btn btn-primary w-100" ${state.loading?'disabled':''}>${state.loading?'결과 만드는 중…':'지휘자에게 요청 →'}</button></div></div><div class="d-flex justify-content-between align-items-center mt-3"><span class="small-label" id="requestNote">첨부한 원본은 작업 요청에만 사용하며 보관하지 않습니다.</span><span class="small-label">${state.agents.length}명 팀원 불러옴</span></div></section><div id="runResult" class="mt-3"></div>`}
  function renderAttachments(){const $list=$('#attachmentList');if(!$list.length)return;$list.html(pendingFiles.map((file,index)=>`<span class="status-pill on">${esc(file.webkitRelativePath||file.name)} <button type="button" class="btn-close ms-1 remove-attachment" data-index="${index}" aria-label="첨부 삭제" style="font-size:8px"></button></span>`).join(''))}
  function readDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(Error('file_read_failed'));reader.readAsDataURL(file)})}
  async function videoFrames(file){const url=URL.createObjectURL(file);try{return await new Promise((resolve,reject)=>{const video=document.createElement('video');video.preload='metadata';video.muted=true;video.onloadedmetadata=async()=>{try{const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),duration=video.duration;if(!Number.isFinite(duration)||duration<=0)throw Error('video_unreadable');const count=Math.min(8,Math.max(1,Math.ceil(duration/15)));canvas.width=Math.min(1024,video.videoWidth);canvas.height=Math.round(canvas.width*video.videoHeight/video.videoWidth);const frames=[];for(let i=0;i<count;i++){video.currentTime=Math.min(duration*.98,duration*(i+.5)/count);await new Promise(done=>video.onseeked=done);ctx.drawImage(video,0,0,canvas.width,canvas.height);frames.push(canvas.toDataURL('image/jpeg',.78))}resolve(frames)}catch(e){reject(e)}};video.onerror=()=>reject(Error('video_unreadable'));video.src=url})}finally{URL.revokeObjectURL(url)}}
  async function collectInputs(){const inputs=[];for(const file of pendingFiles){const filename=file.webkitRelativePath||file.name;if(file.size>49*1024*1024)throw Error(`${file.name}: 파일은 49MB 이하만 첨부할 수 있습니다.`);if(file.type.startsWith('video/')){const frames=await videoFrames(file);inputs.push({type:'input_text',text:`동영상 ${filename} (${Math.round(file.size/1024)}KB): API에서 동영상 원본을 직접 처리하지 않아 영상 길이에 따라 최대 8개 장면 이미지를 추출했습니다.`},...frames.map(image_url=>({type:'input_image',image_url,detail:'high'})));continue}const data=await readDataUrl(file);if(file.type.startsWith('image/'))inputs.push({type:'input_text',text:`첨부 이미지: ${filename}`},{type:'input_image',image_url:data,detail:'high'});else if(file.type.startsWith('audio/')){const format=/\.wav$/i.test(file.name)?'wav':'mp3';if(!/\.(wav|mp3)$/i.test(file.name))throw Error(`${file.name}: 현재 오디오는 WAV·MP3 파일을 지원합니다.`);inputs.push({type:'input_text',text:`첨부 오디오: ${filename}`},{type:'input_audio',input_audio:{data:data.split(',')[1],format}})}else inputs.push({type:'input_file',filename,file_data:data})}const links=$('#linkInput').val().split(/\s+/).filter(Boolean);if(links.length)inputs.push({type:'input_text',text:'참고 링크 (외부 페이지는 직접 열지 않고 주소를 참고 정보로 전달):\n'+links.join('\n')});return inputs}

  function render(){drawNav();const fn={dashboard,request:requestPage,tasks:tasksPage,spaces:spacesPage,automations:automationsPage,teams:teamsPage,skills:skillsPage,connectors:connectorsPage,library:libraryPage,apps:appsPage,projects:projectsPage,activity:activityPage,settings:settingsPage}[state.page]||dashboard;$view.html(fn());if(state.page==='request')$('#modelSelect').val(localStorage.getItem('office:model')||state.models[0]?.slug||'');if(state.page==='settings')$('#defaultModel').val(localStorage.getItem('office:model')||'')}
  function setPage(page){state.page=page;render();window.scrollTo(0,0)}
  function previewArtifact(result){const a=result.artifact;let preview='';if(a.previewUrl)preview=`<iframe class="preview-frame" sandbox="allow-scripts" title="HTML 결과 미리보기" src="${esc(a.previewUrl)}"></iframe>`;else if(a.mime.startsWith('text/csv')){const rows=parseCsv(a.content);preview=`<div class="table-preview mt-3"><table class="table table-sm table-bordered"><tbody>${rows.slice(0,30).map((row,i)=>`<tr>${row.map(cell=>i===0?`<th>${esc(cell)}</th>`:`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}else preview=`<pre class="preview-text mt-3">${esc(a.content.slice(0,20000))}</pre>`;return `<section class="card-soft result-card"><div class="eyebrow">DELIVERABLE READY</div><h2 class="section-title mt-2">${esc(result.summary)}</h2><p class="result-text mt-2">${esc(result.display)}${result.externalActionNotPerformed?'\n\nGoogle Sheets에 직접 쓰지는 않았습니다. 가져오기 가능한 CSV 파일을 만들었습니다.':''}</p><div class="file-row"><div><div class="file-name">${esc(a.filename)}</div><div class="file-type">완성 파일 · 로컬 라이브러리에 보관됨</div></div><div class="d-flex gap-2"><a class="btn btn-primary" href="${esc(a.url)}" download>파일 다운로드</a>${a.previewUrl?`<a class="btn btn-light" href="${esc(a.previewUrl)}" target="_blank" rel="noopener">새 창 미리보기</a>`:''}</div></div>${preview}<div class="divider"></div><div class="small-label">배정된 팀원: ${result.plan.map(p=>esc(p.path.split('/').pop().replace('.md',''))).join(' · ')}</div></section>`}
  function parseCsv(text){const rows=[];let row=[],value='',inside=false;const clean=text.replace(/^\uFEFF/,'');for(let i=0;i<clean.length;i++){const c=clean[i];if(c==='"'){if(inside&&clean[i+1]==='"'){value+='"';i++}else inside=!inside}else if(c===','&&!inside){row.push(value);value=''}else if((c==='\n'||c==='\r')&&!inside){if(c==='\r'&&clean[i+1]==='\n')i++;row.push(value);if(row.some(Boolean))rows.push(row);row=[];value=''}else value+=c}row.push(value);if(row.some(Boolean))rows.push(row);return rows}
  async function refresh(){try{const s=await api('/api/status');state.previewMode=false;state.connected=s.connected;state.email=s.email||'';state.models=s.models||[];state.files=s.files||[];state.agents=s.agents||[];$('#topStatus').text(state.connected?'ChatGPT 연결됨':'ChatGPT 미연결').toggleClass('on',state.connected);if(state.page==='teams'||state.page==='dashboard'||state.page==='request'||state.page==='settings'||state.page==='library')render()}catch{state.previewMode=true;state.connected=false;state.models=[];try{const response=await fetch('/agents.json');if(response.ok){const data=await response.json();state.agents=Array.isArray(data)?data:(data.agents||[])}}catch{}$('#topStatus').text('사이트 미리보기');if(state.page==='teams'||state.page==='dashboard'||state.page==='request'||state.page==='settings'||state.page==='library')render()}}
  $(document).on('click','[data-page]',function(){setPage($(this).data('page'));$('.sidebar').removeClass('mobile-open');$('#mobileShade').removeClass('show')});
  $(document).on('click','.connector-setup',function(){const name=$(this).data('name'),setup=$(this).data('setup'),links={'Google Sheets':'https://console.cloud.google.com/apis/credentials','Google Drive':'https://console.cloud.google.com/apis/credentials','Google Docs':'https://console.cloud.google.com/apis/credentials','Google Calendar':'https://console.cloud.google.com/apis/credentials','Notion':'https://www.notion.so/profile/integrations','GitHub':'https://github.com/settings/developers','Slack':'https://api.slack.com/apps','Microsoft 365':'https://entra.microsoft.com/','Dropbox':'https://www.dropbox.com/developers/apps'};$('#connectorModalTitle').text(`${name} 연결 설정`);$('#connectorModalBody').text(`${setup}. OAuth는 서비스마다 앱 등록과 허용된 리디렉션 주소 설정이 필요합니다. 현재 카드 목록은 준비 상태이며, 이 정보를 연결할 앱 설정이 완료되어야 실제 계정 승인 화면을 열 수 있습니다.`);$('#connectorDocs').attr('href',links[name]||'#');bootstrap.Modal.getOrCreateInstance('#connectorModal').show()});
  $(document).on('input','#resourceSearch',function(){const q=$(this).val();const y=window.scrollY;$('.agent-grid').replaceWith($(agentsView(q)));window.scrollTo(0,y)});
  $(document).on('click','#pickFiles',()=>$('#attachmentInput').trigger('click'));
  $(document).on('click','#pickFolder',()=>$('#folderInput').trigger('click'));
  $(document).on('change','#attachmentInput,#folderInput',function(){const added=Array.from(this.files||[]),total=[...pendingFiles,...added].reduce((sum,file)=>sum+file.size,0);if(total>50*1024*1024){$('#requestNote').text('첨부 파일의 총 용량은 50MB를 넘을 수 없습니다.');this.value='';return}pendingFiles.push(...added);this.value='';renderAttachments()});
  $(document).on('click','.remove-attachment',function(){pendingFiles.splice(Number($(this).data('index')),1);renderAttachments()});
  $(document).on('paste','#taskInput',function(event){const files=Array.from(event.originalEvent.clipboardData?.items||[]).map(item=>item.getAsFile()).filter(Boolean);if(files.length){const total=[...pendingFiles,...files].reduce((sum,file)=>sum+file.size,0);if(total<=50*1024*1024){pendingFiles.push(...files);renderAttachments()}else $('#requestNote').text('붙여넣은 파일까지 포함해 총 50MB를 넘었습니다.')}});
  $(document).on('dragover','.task-form',event=>event.preventDefault());
  $(document).on('drop','.task-form',function(event){event.preventDefault();const files=Array.from(event.originalEvent.dataTransfer?.files||[]),total=[...pendingFiles,...files].reduce((sum,file)=>sum+file.size,0);if(total<=50*1024*1024){pendingFiles.push(...files);renderAttachments()}else $('#requestNote').text('첨부 파일의 총 용량은 50MB를 넘을 수 없습니다.')});
  $(document).on('click','#runTask',async function(){if(state.previewMode){$('#runResult').html('<div class="alert-soft">사이트 미리보기에서는 AI 연결을 사용할 수 없습니다. Windows 또는 Android 앱에서 실행해 주세요.</div>');return}const task=$('#taskInput').val().trim(),model=$('#modelSelect').val(),format=$('#formatSelect').val();if(!task){$('#requestNote').text('요청 내용을 먼저 입력해 주세요.');return}if(!model){$('#requestNote').text('ChatGPT 계정을 연결하고 모델을 선택해 주세요.');return}state.loading=true;$(this).prop('disabled',true).text('결과 만드는 중…');$('#runResult').empty();$('#requestNote').text('첨부 파일을 읽고 지휘자가 담당자를 배정하는 중입니다.');try{const attachments=await collectInputs(),result=await api('/api/run',{task,model,format,attachments});const now=new Date().toLocaleString('ko-KR');const files=read('files');files.push({...result.artifact,format:result.format,createdAt:now});write('files',files);state.files.unshift({...result.artifact,format:result.format,createdAt:now});const tasks=read('tasks');tasks.push({id:crypto.randomUUID(),title:task,date:now,done:true,file:{filename:result.artifact.filename,url:result.artifact.url}});write('tasks',tasks);pendingFiles=[];$('#runResult').html(previewArtifact(result));$('#requestNote').text('완성 파일을 저장했습니다. 라이브러리에서 다시 다운로드할 수 있어요.')}catch(error){$('#runResult').html(`<div class="alert alert-danger small">결과 파일 생성에 실패했습니다: ${esc(error.message)}</div>`);$('#requestNote').text('실패한 요청은 작업 내역에 저장하지 않았습니다.')}finally{state.loading=false;$('#runTask').prop('disabled',false).text('지휘자에게 요청 →')}});
  $(document).on('click','#connect',async function(){try{const r=await api('/api/connect',{});if(window.parent!==window)window.parent.postMessage({type:'open-auth',url:r.url},location.origin);else if(window.cordova?.plugins?.browsertab)window.cordova.plugins.browsertab.openUrl(r.url);else window.open(r.url,'_blank','noopener')}catch(e){alert(e.message)}});
  $(document).on('click','#disconnect',async function(){try{await api('/api/disconnect',{});await refresh();setPage('settings')}catch(e){alert(e.message)}});
  $(document).on('click','#refreshModels',async function(){try{state.models=await api('/api/models',{});await refresh();$('#settingsNote').text('모델 목록을 새로 불러왔습니다.')}catch(e){$('#settingsNote').text('모델을 불러오지 못했습니다: '+e.message)}});
  $(document).on('click','#saveSettings',function(){localStorage.setItem('office:model',$('#defaultModel').val()||'');$('#settingsNote').text('기본 모델을 저장했습니다.')});
  $(document).on('change','.task-check',function(){const items=read('tasks'),item=items.find(x=>x.id===$(this).data('id'));if(item){item.done=this.checked;write('tasks',items);render()}});
  $('#globalSearch').on('input',function(){const q=$(this).val().toLowerCase();if(!q)return;const found=state.agents.some(a=>(a.name+' '+a.division).toLowerCase().includes(q));if(found){setPage('teams');$('#resourceSearch').val(q).trigger('input')}});
  $('#menuButton').on('click',()=>{$('.sidebar').toggleClass('mobile-open');$('#mobileShade').toggleClass('show')});
  $('#mobileShade').on('click',()=>{$('.sidebar').removeClass('mobile-open');$('#mobileShade').removeClass('show')});
  $('#mobileMore').on('click',()=>{$('.sidebar').toggleClass('mobile-open');$('#mobileShade').toggleClass('show')});
  window.addEventListener('message',event=>{if(event.source===window.parent&&event.data?.type==='app-resume')refresh()});
  if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
  drawNav();render();refresh();
})();
</script>
