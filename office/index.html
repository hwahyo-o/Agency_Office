<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>AI 팀 오피스</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--ink:#202735;--muted:#7c8798;--line:#e7eaf0;--paper:#fff;--canvas:#f6f7fb;--blue:#5978ef;--pale:#edf1ff;--green:#278b70;--sidebar:246px}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:16px;padding:0 10px 22px}.brand-mark{width:32px;height:32px;border-radius:11px;background:var(--pale);display:grid;place-items:center;color:var(--blue);font-size:18px}.nav-group{margin:13px 10px 7px;color:#a0a8b4;font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.nav-link{border:0;background:transparent;width:100%;display:flex;gap:11px;align-items:center;text-align:left;padding:9px 11px;border-radius:9px;color:#667183;font-size:12px;font-weight:550;margin:1px 0}.nav-link:hover{background:#f7f8fc;color:var(--ink)}.nav-link.active{background:var(--pale);color:#3d5fdd;font-weight:700}.nav-icon{width:18px;text-align:center;font-size:14px;color:#8390a2}.nav-link.active .nav-icon{color:var(--blue)}.sidebar-foot{margin-top:auto;padding-top:15px;border-top:1px solid var(--line)}.main{margin-left:var(--sidebar);min-height:100vh}.topbar{height:64px;background:rgba(255,255,255,.86);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4;backdrop-filter:blur(10px)}.crumb{color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:10px}.search{height:34px;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:#fff;font-size:11px}.avatar{width:31px;height:31px;border-radius:50%;background:#ecf0f6;color:#5f6b7d;display:grid;place-items:center;font-weight:700;font-size:11px}.content{max-width:1240px;padding:31px 34px 60px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:15px}.page-head h1{font-size:22px;font-weight:730;letter-spacing:-.035em;margin:0 0 5px}.page-head p{font-size:12px;color:var(--muted);margin:0}.eyebrow{font-size:10px;font-weight:700;color:#8190a5;letter-spacing:.09em;text-transform:uppercase}.card-soft{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px}.hero{padding:26px 28px;border-radius:16px;background:linear-gradient(115deg,#fff 15%,#f5f7ff 100%);border:1px solid var(--line);margin-bottom:18px}.hero h2{font-size:23px;font-weight:730;letter-spacing:-.04em;margin:7px 0}.hero p{font-size:12px;color:var(--muted);margin:0}.btn-primary{--bs-btn-bg:var(--blue);--bs-btn-border-color:var(--blue);--bs-btn-hover-bg:#4868df;--bs-btn-hover-border-color:#4868df}.btn{font-size:11px;font-weight:650;border-radius:8px;padding:8px 12px}.btn-light{border:1px solid var(--line);background:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{padding:16px 17px}.stat span{font-size:11px;color:var(--muted)}.stat b{display:block;font-size:22px;margin-top:5px;font-weight:720}.section-title{font-size:13px;font-weight:700;margin:0}.section-sub{color:var(--muted);font-size:11px;margin:3px 0 0}.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}.task-form textarea{min-height:170px;resize:vertical;border-color:var(--line);font-size:13px;line-height:1.65;padding:13px}.task-form select,.form-select,.form-control{font-size:12px;border-color:var(--line);border-radius:8px}.task-form .form-label,.form-label{font-size:11px;font-weight:650;color:#657184}.status-pill{border-radius:99px;padding:5px 9px;background:#f0f2f5;color:#778395;font-size:10px}.status-pill.on{color:var(--green);background:#eaf7f3}.empty{padding:34px 15px;text-align:center;color:#8a94a3}.empty b{display:block;color:#4d596a;font-size:12px;margin-bottom:5px}.empty span{font-size:11px}.empty-icon{height:39px;width:39px;border-radius:13px;background:#f3f5f9;color:#7f8ca1;display:grid;place-items:center;margin:0 auto 11px;font-size:17px}.agent-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.agent-card{padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:62px}.agent-card b{display:block;font-size:11px;font-weight:670;text-transform:capitalize}.agent-card small{color:var(--muted);font-size:10px}.agent-meta{font-size:10px;color:var(--muted)}.result-card{border-color:#dce4ff;background:#fff}.result-card .result-text{font-size:12px;line-height:1.7;white-space:pre-wrap}.file-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}.file-name{font-size:11px;font-weight:680}.file-type{font-size:10px;color:var(--muted)}.preview-frame{width:100%;height:390px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:12px}.preview-text{white-space:pre-wrap;overflow:auto;max-height:390px;background:#f8f9fb;padding:13px;border-radius:9px;font-size:11px}.table-preview{overflow:auto;max-height:390px}.table-preview td,.table-preview th{font-size:10px}.filter-row{display:flex;gap:9px;align-items:center}.table-clean{font-size:11px}.table-clean th{color:#7f8b9b;font-weight:650;border-bottom-color:var(--line)}.table-clean td{vertical-align:middle}.check{accent-color:var(--blue)}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.workspace-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.workspace-card{color:inherit;text-decoration:none;cursor:pointer;transition:transform .12s,border-color .12s}.workspace-card:hover{transform:translateY(-2px);border-color:#cbd5ff}.workspace-card strong{display:block;font-size:12px;margin:10px 0 3px}.workspace-card span{font-size:10px;color:var(--muted)}.workspace-icon{height:34px;width:34px;border-radius:11px;background:#f2f4f8;color:#61728d;display:grid;place-items:center}.divider{height:1px;background:var(--line);margin:17px 0}.mobile-menu{display:none}.muted{color:var(--muted)}.small-label{font-size:10px;color:var(--muted)}.alert-soft{background:#f6f8ff;border:1px solid #e3e9ff;color:#5c6a87;font-size:11px;padding:12px;border-radius:9px}.download-card{border:1px solid var(--line);border-radius:10px;padding:13px;background:white}.download-card:hover{border-color:#cbd5ff}@media(max-width:900px){:root{--sidebar:205px}.content{padding:24px 20px 50px}.topbar{padding:0 20px}.agent-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.workspace-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.sidebar{display:none}.main{margin-left:0}.mobile-menu{display:inline-flex}.topbar{height:57px;padding:0 13px}.content{padding:20px 13px 38px}.search{display:none}.page-head h1{font-size:19px}.page-head{align-items:center}.two-col{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.agent-grid,.workspace-grid,.settings-grid{grid-template-columns:1fr}.hero{padding:22px}.hero h2{font-size:20px}.page-head .btn{white-space:nowrap}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">✳</span><span>AI 팀 오피스</span></div>
    <nav id="sideNav" aria-label="주 메뉴"></nav>
    <div class="sidebar-foot"><button class="nav-link" data-page="settings"><span class="nav-icon">⚙</span>설정</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="d-flex align-items-center gap-2"><button class="btn btn-light mobile-menu" id="menuButton">☰</button><span class="crumb" id="breadcrumb">전체 대시보드</span></div><div class="top-actions"><input class="search" id="globalSearch" placeholder="팀원, 업무, 프로젝트 검색"><span class="status-pill" id="topStatus">연결 확인 중</span><span class="avatar">AI</span></div></header>
    <div class="content" id="view"></div>
  </main>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
(() => {
  const nav = [
    {group:'WORKSPACE',items:[['dashboard','▦','전체 대시보드'],['request','＋','새 작업 요청'],['tasks','☑','할 일'],['spaces','▤','업무 공간'],['automations','◷','자동 업무']]},
    {group:'RESOURCES',items:[['teams','✳','AI 팀'],['skills','◇','스킬'],['connectors','⌘','커넥터'],['library','▧','라이브러리'],['apps','▣','앱'],['projects','▰','프로젝트']]},
    {group:'HISTORY',items:[['activity','↻','전체 작업 내역']]}
  ];
  const titles={dashboard:'전체 대시보드',request:'새 작업 요청',tasks:'할 일',spaces:'업무 공간',automations:'자동 업무',teams:'AI 팀',skills:'스킬',connectors:'커넥터',library:'라이브러리',apps:'앱',projects:'프로젝트',activity:'전체 작업 내역',settings:'설정'};
  const $view=$('#view');let state={agents:[],models:[],files:[],connected:false,email:'',page:'dashboard',loading:false,previewMode:false};
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const read=(key,fallback=[])=>{try{return JSON.parse(localStorage.getItem('office:'+key))??fallback}catch{return fallback}};
  const write=(key,value)=>localStorage.setItem('office:'+key,JSON.stringify(value));
  const api=async(path,data)=>{const response=await fetch(path,{method:data?'POST':'GET',headers:data?{'content-type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const result=await response.json();if(!response.ok)throw Error(result.error||'요청을 처리하지 못했습니다.');return result};
  function drawNav(){const html=nav.map(group=>`<div class="nav-group">${group.group}</div>${group.items.map(([id,icon,label])=>`<button class="nav-link ${state.page===id?'active':''}" data-page="${id}"><span class="nav-icon">${icon}</span>${label}</button>`).join('')}`).join('');$('#sideNav').html(html);$('[data-page="settings"]').toggleClass('active',state.page==='settings');$('#breadcrumb').text(titles[state.page]||'AI 팀 오피스')}
  function pageHead(title,sub,button=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
  function empty(icon,title,sub){return `<div class="empty"><div class="empty-icon">${icon}</div><b>${title}</b><span>${sub}</span></div>`}
  function fileCards(items){return items.map(file=>`<div class="file-row"><div><div class="file-name">${esc(file.filename)}</div><div class="file-type">${esc(file.createdAt||'파일 결과')} · ${esc(file.format||'파일')}</div></div><div class="d-flex gap-2"><a class="btn btn-light" href="${esc(file.url)}" download>다운로드</a>${file.previewUrl?`<a class="btn btn-light" target="_blank" rel="noopener" href="${esc(file.previewUrl)}">미리보기</a>`:''}</div></div>`).join('')}
  function agentsView(search=''){const list=state.agents.filter(a=>(a.name+' '+a.division).toLowerCase().includes(search.toLowerCase()));return `<div class="agent-grid">${list.map(a=>`<article class="agent-card"><b>${esc(a.name)}</b><small>${esc(a.division)}</small></article>`).join('')}</div>`}
  function dashboard(){const tasks=read('tasks'),files=state.files.length?state.files:read('files'),projects=read('projects'),auto=read('automations');return `${pageHead('전체 대시보드','업무와 결과물을 한곳에서 확인하세요.',`<button class="btn btn-primary" data-page="request">새 작업 요청 <span class="ms-1">→</span></button>`)}${state.previewMode?'<div class="alert-soft mb-3">사이트 미리보기에서는 화면 탐색만 가능합니다. 실제 AI 작업과 파일 생성은 Windows 앱에서 사용하세요.</div>':''}<section class="hero"><div class="eyebrow">AI TEAM WORKSPACE</div><h2>오늘 할 일을 팀에 맡겨보세요.</h2><p>요청을 실행하고, 완성된 결과 파일을 내려받아 이어서 사용할 수 있습니다.</p></section><div class="stats"><div class="card-soft stat"><span>진행 중인 할 일</span><b>${tasks.filter(x=>!x.done).length}</b></div><div class="card-soft stat"><span>완성 결과 파일</span><b>${files.length}</b></div><div class="card-soft stat"><span>프로젝트</span><b>${projects.length}</b></div><div class="card-soft stat"><span>자동 업무</span><b>${auto.length}</b></div></div><div class="two-col"><section class="card-soft"><div class="d-flex justify-content-between align-items-center"><div><h2 class="section-title">최근 작업</h2><p class="section-sub">직접 요청한 작업과 생성 결과</p></div><button class="btn btn-light" data-page="activity">전체 내역</button></div><div class="divider"></div>${tasks.length?tasks.slice(-5).reverse().map(t=>`<div class="file-row"><div><div class="file-name">${esc(t.title)}</div><div class="file-type">${esc(t.date)} · ${t.done?'완료':'진행 중'}</div></div><span class="status-pill ${t.done?'on':''}">${t.done?'완료':'진행 중'}</span></div>`).join(''):empty('↻','아직 작업 내역이 없습니다','새 요청을 실행하면 완료 내역과 파일이 여기에 모입니다.')}</section><section class="card-soft"><div><h2 class="section-title">ChatGPT 연결</h2><p class="section-sub">계정 로그인으로 사용할 모델을 연결합니다.</p></div><div class="divider"></div><div class="d-flex justify-content-between align-items-center"><span class="small-label">${state.connected?esc(state.email||'연결됨'):'연결된 계정 없음'}</span><span class="status-pill ${state.connected?'on':''}">${state.connected?'연결됨':'미연결'}</span></div><button class="btn btn-light mt-3" data-page="settings">연결 설정 보기</button></section></div>`}
  function requestPage(){return `${pageHead('새 작업 요청','요청을 맡기면 오케스트레이터가 적합한 팀원을 배정하고, 실제 결과 파일을 생성합니다.')}<section class="card-soft task-form"><div class="row g-3"><div class="col-12"><label class="form-label" for="taskInput">요청 내용</label><textarea id="taskInput" class="form-control" placeholder="예: 2026년 11월 달력을 CSV 파일로 만들어줘. 날짜별 요일과 메모 칸을 포함해줘."></textarea></div><div class="col-md-5"><label class="form-label" for="modelSelect">사용 모델</label><select id="modelSelect" class="form-select"><option value="">${state.models.length?'모델을 선택하세요':'ChatGPT 연결 후 모델 표시'}</option>${state.models.map(m=>`<option value="${esc(m.slug)}">${esc(m.name)}</option>`).join('')}</select></div><div class="col-md-4"><label class="form-label" for="formatSelect">결과 파일 형식</label><select id="formatSelect" class="form-select"><option value="auto">자동 선택</option><option value="csv">표·스프레드시트 (CSV)</option><option value="html">인터랙티브 웹 파일 (HTML)</option><option value="json">데이터 (JSON)</option><option value="txt">텍스트 (TXT)</option></select></div><div class="col-md-3 d-flex align-items-end"><button id="runTask" class="btn btn-primary w-100" ${state.loading?'disabled':''}>${state.loading?'결과 만드는 중…':'지휘자에게 요청 →'}</button></div></div><div class="d-flex justify-content-between align-items-center mt-3"><span class="small-label" id="requestNote">요청을 완료하면 화면에서 미리보고 파일로 다운로드할 수 있습니다.</span><span class="small-label">${state.agents.length}명 팀원 불러옴</span></div></section><div id="runResult" class="mt-3"></div>`}
  function tasksPage(){const tasks=read('tasks');return `${pageHead('할 일','내가 요청한 작업을 모아 보고 완료 상태를 관리합니다.',`<button class="btn btn-primary" data-page="request">+ 작업 추가</button>`)}<section class="card-soft">${tasks.length?`<div class="table-responsive"><table class="table table-clean align-middle"><thead><tr><th>완료</th><th>작업</th><th>결과</th><th>요청일</th></tr></thead><tbody>${tasks.slice().reverse().map(t=>`<tr><td><input type="checkbox" class="check task-check" data-id="${esc(t.id)}" ${t.done?'checked':''}></td><td>${esc(t.title)}</td><td>${t.file?`<a href="${esc(t.file.url)}">${esc(t.file.filename)}</a>`:'—'}</td><td>${esc(t.date)}</td></tr>`).join('')}</tbody></table></div>`:empty('☑','할 일이 없습니다','작업을 요청하면 여기에 표시됩니다.')}</section>`}
  function spacesPage(){const spaces=[['request','＋','요청 접수','업무 요청과 결과물 생성'],['tasks','☑','할 일 공간','진행 중·완료 작업 관리'],['projects','▰','프로젝트 공간','프로젝트별 파일과 내역'],['library','▧','라이브러리','생성한 파일 모아보기'],['automations','◷','자동 업무','예약 및 반복 업무']];return `${pageHead('업무 공간','용도별 공간으로 이동해 필요한 업무를 이어가세요.')}<div class="workspace-grid">${spaces.map(([id,icon,title,desc])=>`<article class="card-soft workspace-card" data-page="${id}"><div class="workspace-icon">${icon}</div><strong>${title}</strong><span>${desc}</span></article>`).join('')}</div>`}
  function automationsPage(){const rows=read('automations');return `${pageHead('자동 업무','예약하거나 반복 실행할 업무를 관리합니다.')}<section class="card-soft">${rows.length?rows.map(x=>`<div class="file-row"><div><div class="file-name">${esc(x.title)}</div><div class="file-type">${esc(x.schedule)}</div></div><span class="status-pill">${x.enabled?'활성':'일시 중지'}</span></div>`).join(''):empty('◷','설정된 자동 업무가 없습니다','이 데스크톱 앱은 앱이 켜져 있을 때만 요청을 처리합니다. 예약 실행 기능은 아직 연결되지 않았습니다.')}</section>`}
  function teamsPage(){const q=$('#resourceSearch').val()||'';return `${pageHead('AI 팀','Agency Agents 공개 저장소의 직원 정의를 불러옵니다. 현재 ${state.agents.length}명')}<section class="card-soft"><div class="mb-3"><input class="form-control" id="resourceSearch" placeholder="팀원 이름·부서 검색" value="${esc(q)}"></div>${agentsView(q)}</section>`}
  function skillsPage(){const divisions=[...new Set(state.agents.map(a=>a.division))].sort();return `${pageHead('스킬','현재 팀원 Markdown 지침을 실행 가능한 역할 스킬로 연결합니다.')}<section class="card-soft"><div class="alert-soft mb-3">팀원 정의와 스킬 카탈로그는 같은 Agency Agents 저장소에서 불러옵니다. 별도 예시 스킬은 만들지 않았습니다.</div>${divisions.length?`<div class="workspace-grid">${divisions.map(name=>`<article class="agent-card"><b>${esc(name)}</b><small>${state.agents.filter(a=>a.division===name).length}개 역할 지침</small></article>`).join('')}</div>`:empty('◇','스킬 목록을 불러오지 못했습니다','새로고침 후 다시 시도해 주세요.')}</section>`}
  function connectorsPage(){return `${pageHead('커넥터','외부 서비스 연결 상태를 관리합니다.')}<section class="card-soft">${empty('⌘','연결된 외부 커넥터가 없습니다','현재는 생성 파일 다운로드를 지원합니다. Google Drive/Sheets 등에 직접 쓰려면 해당 서비스 OAuth 커넥터 연결이 필요합니다.')}</section>`}
  function libraryPage(){const files=(state.files.length?state.files:read('files')).slice().reverse();return `${pageHead('라이브러리','AI 팀 오피스에서 생성한 결과 파일입니다.')}<section class="card-soft">${files.length?fileCards(files):empty('▧','저장된 파일이 없습니다','작업을 요청하고 결과물을 만들면 여기서 다시 다운로드할 수 있습니다.')}</section>`}
  function appsPage(){const apps=read('apps');return `${pageHead('앱','오피스에서 사용할 수 있는 도구를 모아봅니다.')}<section class="card-soft">${apps.length?apps.map(x=>`<div class="file-row"><div><div class="file-name">${esc(x.name)}</div><div class="file-type">${esc(x.status||'연결됨')}</div></div></div>`).join(''):empty('▣','등록된 앱이 없습니다','앱 연결은 설정된 커넥터가 있을 때 표시됩니다.')}</section>`}
  function projectsPage(){const projects=read('projects');return `${pageHead('프로젝트','프로젝트별로 요청과 결과 파일을 정리합니다.')}<section class="card-soft">${projects.length?projects.map(p=>`<div class="file-row"><div><div class="file-name">${esc(p.name)}</div><div class="file-type">${p.tasks||0}개 작업</div></div></div>`).join(''):empty('▰','프로젝트가 없습니다','아직 생성된 프로젝트가 없습니다.')}</section>`}
  function activityPage(){const tasks=read('tasks').slice().reverse();return `${pageHead('전체 작업 내역','요청, 처리 상태, 내려받을 수 있는 결과물을 시간순으로 봅니다.')}<section class="card-soft">${tasks.length?tasks.map(t=>`<div class="file-row"><div><div class="file-name">${esc(t.title)}</div><div class="file-type">${esc(t.date)} · ${t.done?'완료':'실패'}</div></div>${t.file?`<a class="btn btn-light" href="${esc(t.file.url)}" download>파일 받기</a>`:''}</div>`).join(''):empty('↻','작업 내역이 없습니다','완료하거나 실행한 작업이 여기에 기록됩니다.')}</section>`}
  function settingsPage(){return `${pageHead('설정','ChatGPT 계정과 기본 작업 옵션을 관리합니다.')}<div class="settings-grid"><section class="card-soft"><h2 class="section-title">ChatGPT 계정</h2><p class="section-sub">별도 API 키 없이 계정 로그인과 플랜 사용 동의로 연결합니다.</p><div class="divider"></div><div class="d-flex justify-content-between align-items-center"><span class="small-label">${state.connected?esc(state.email||'연결됨'):'연결되어 있지 않음'}</span><span class="status-pill ${state.connected?'on':''}">${state.connected?'연결됨':'미연결'}</span></div><div class="d-flex gap-2 mt-3">${state.connected?'<button class="btn btn-light" id="disconnect">연결 해제</button>':'<button class="btn btn-primary" id="connect">ChatGPT 연결</button>'}<button class="btn btn-light" id="refreshModels">모델 새로고침</button></div></section><section class="card-soft"><h2 class="section-title">기본 모델</h2><p class="section-sub">새 요청 페이지에서 선택한 모델을 저장합니다.</p><div class="divider"></div><select class="form-select" id="defaultModel">${state.models.map(m=>`<option value="${esc(m.slug)}">${esc(m.name)}</option>`).join('')||'<option>ChatGPT 연결 후 표시</option>'}</select><button class="btn btn-light mt-3" id="saveSettings">저장</button><p class="small-label mt-2" id="settingsNote"></p></section><section class="card-soft"><h2 class="section-title">파일</h2><p class="section-sub">생성 결과는 사용자 프로필 아래 AI Team Office 보관 폴더에 저장됩니다.</p></section><section class="card-soft"><h2 class="section-title">외부 서비스</h2><p class="section-sub">계정 또는 API 액션은 해당 커넥터를 연결한 뒤에만 실행됩니다.</p></section></div>`}
  function render(){drawNav();const fn={dashboard,request:requestPage,tasks:tasksPage,spaces:spacesPage,automations:automationsPage,teams:teamsPage,skills:skillsPage,connectors:connectorsPage,library:libraryPage,apps:appsPage,projects:projectsPage,activity:activityPage,settings:settingsPage}[state.page]||dashboard;$view.html(fn());if(state.page==='request')$('#modelSelect').val(localStorage.getItem('office:model')||state.models[0]?.slug||'');if(state.page==='settings')$('#defaultModel').val(localStorage.getItem('office:model')||'')}
  function setPage(page){state.page=page;render();window.scrollTo(0,0)}
  function previewArtifact(result){const a=result.artifact;let preview='';if(a.previewUrl)preview=`<iframe class="preview-frame" sandbox="allow-scripts" title="HTML 결과 미리보기" src="${esc(a.previewUrl)}"></iframe>`;else if(a.mime.startsWith('text/csv')){const rows=parseCsv(a.content);preview=`<div class="table-preview mt-3"><table class="table table-sm table-bordered"><tbody>${rows.slice(0,30).map((row,i)=>`<tr>${row.map(cell=>i===0?`<th>${esc(cell)}</th>`:`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}else preview=`<pre class="preview-text mt-3">${esc(a.content.slice(0,20000))}</pre>`;return `<section class="card-soft result-card"><div class="eyebrow">DELIVERABLE READY</div><h2 class="section-title mt-2">${esc(result.summary)}</h2><p class="result-text mt-2">${esc(result.display)}${result.externalActionNotPerformed?'\n\nGoogle Sheets에 직접 쓰지는 않았습니다. 가져오기 가능한 CSV 파일을 만들었습니다.':''}</p><div class="file-row"><div><div class="file-name">${esc(a.filename)}</div><div class="file-type">완성 파일 · 로컬 라이브러리에 보관됨</div></div><div class="d-flex gap-2"><a class="btn btn-primary" href="${esc(a.url)}" download>파일 다운로드</a>${a.previewUrl?`<a class="btn btn-light" href="${esc(a.previewUrl)}" target="_blank" rel="noopener">새 창 미리보기</a>`:''}</div></div>${preview}<div class="divider"></div><div class="small-label">배정된 팀원: ${result.plan.map(p=>esc(p.path.split('/').pop().replace('.md',''))).join(' · ')}</div></section>`}
  function parseCsv(text){const rows=[];let row=[],value='',inside=false;const clean=text.replace(/^\uFEFF/,'');for(let i=0;i<clean.length;i++){const c=clean[i];if(c==='"'){if(inside&&clean[i+1]==='"'){value+='"';i++}else inside=!inside}else if(c===','&&!inside){row.push(value);value=''}else if((c==='\n'||c==='\r')&&!inside){if(c==='\r'&&clean[i+1]==='\n')i++;row.push(value);if(row.some(Boolean))rows.push(row);row=[];value=''}else value+=c}row.push(value);if(row.some(Boolean))rows.push(row);return rows}
  async function refresh(){try{const s=await api('/api/status');state.previewMode=false;state.connected=s.connected;state.email=s.email||'';state.models=s.models||[];state.files=s.files||[];state.agents=s.agents||[];$('#topStatus').text(state.connected?'ChatGPT 연결됨':'ChatGPT 미연결').toggleClass('on',state.connected);if(state.page==='teams'||state.page==='dashboard'||state.page==='request'||state.page==='settings'||state.page==='library')render()}catch{state.previewMode=true;state.connected=false;state.models=[];try{const response=await fetch('/agents.json');if(response.ok){const data=await response.json();state.agents=Array.isArray(data)?data:(data.agents||[])}}catch{}$('#topStatus').text('사이트 미리보기');if(state.page==='teams'||state.page==='dashboard'||state.page==='request'||state.page==='settings'||state.page==='library')render()}}
  $(document).on('click','[data-page]',function(){setPage($(this).data('page'))});
  $(document).on('input','#resourceSearch',function(){const q=$(this).val();const y=window.scrollY;$('.agent-grid').replaceWith($(agentsView(q)));window.scrollTo(0,y)});
  $(document).on('click','#runTask',async function(){if(state.previewMode){$('#runResult').html('<div class="alert-soft">사이트 미리보기에서는 AI 연결을 사용할 수 없습니다. Windows 앱에서 실행해 주세요.</div>');return}const task=$('#taskInput').val().trim(),model=$('#modelSelect').val(),format=$('#formatSelect').val();if(!task){$('#requestNote').text('요청 내용을 먼저 입력해 주세요.');return}if(!model){$('#requestNote').text('ChatGPT 계정을 연결하고 모델을 선택해 주세요.');return}state.loading=true;$(this).prop('disabled',true).text('결과 만드는 중…');$('#runResult').empty();$('#requestNote').text('지휘자가 담당자를 고르고 완성 파일을 생성하는 중입니다.');try{const result=await api('/api/run',{task,model,format});const now=new Date().toLocaleString('ko-KR');const files=read('files');files.push({...result.artifact,format:result.format,createdAt:now});write('files',files);state.files.unshift({...result.artifact,format:result.format,createdAt:now});const tasks=read('tasks');tasks.push({id:crypto.randomUUID(),title:task,date:now,done:true,file:{filename:result.artifact.filename,url:result.artifact.url}});write('tasks',tasks);$('#runResult').html(previewArtifact(result));$('#requestNote').text('완성 파일을 저장했습니다. 링크를 눌러 다운로드할 수 있어요.')}catch(error){$('#runResult').html(`<div class="alert alert-danger small">결과 파일 생성에 실패했습니다: ${esc(error.message)}</div>`);$('#requestNote').text('실패한 요청은 작업 내역에 저장하지 않았습니다.')}finally{state.loading=false;$('#runTask').prop('disabled',false).text('지휘자에게 요청 →')}});
  $(document).on('click','#connect',async function(){try{const r=await api('/api/connect',{});window.open(r.url,'_blank','noopener')}catch(e){alert(e.message)}});
  $(document).on('click','#disconnect',async function(){try{await api('/api/disconnect',{});await refresh();setPage('settings')}catch(e){alert(e.message)}});
  $(document).on('click','#refreshModels',async function(){try{state.models=await api('/api/models',{});await refresh();$('#settingsNote').text('모델 목록을 새로 불러왔습니다.')}catch(e){$('#settingsNote').text('모델을 불러오지 못했습니다: '+e.message)}});
  $(document).on('click','#saveSettings',function(){localStorage.setItem('office:model',$('#defaultModel').val()||'');$('#settingsNote').text('기본 모델을 저장했습니다.')});
  $(document).on('change','.task-check',function(){const items=read('tasks'),item=items.find(x=>x.id===$(this).data('id'));if(item){item.done=this.checked;write('tasks',items);render()}});
  $('#globalSearch').on('input',function(){const q=$(this).val().toLowerCase();if(!q)return;const found=state.agents.some(a=>(a.name+' '+a.division).toLowerCase().includes(q));if(found){setPage('teams');$('#resourceSearch').val(q).trigger('input')}});
  $('#menuButton').on('click',()=>{$('.sidebar').toggle()});
  drawNav();render();refresh();
})();
</script>
</body>
</html>
